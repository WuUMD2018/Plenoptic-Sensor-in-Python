[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plenoptic-studio"
version = "1.2.0"
description = "Coherent plenoptic sensor simulation and image-only Zernike reconstruction"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<4", "PySide6>=6.6,<7"]

[project.scripts]
plenoptic-studio = "plenoptic_studio.gui:launch"

[tool.setuptools.packages.find]
include = ["plenoptic_studio*"]
exclude = ["plenoptic_studio.tests*"]

[tool.setuptools.package-data]
plenoptic_studio = ["assets/*", "docs/*"]
